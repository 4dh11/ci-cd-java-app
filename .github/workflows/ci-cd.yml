name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: 1. Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile & Run Unit Tests
      run: mvn clean test

    - name: Package Application
      run: mvn package -DskipTests

  docker-build-push:
    name: 2. Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:${{ github.sha }}

  k8s-deploy-validation:
    name: 3. Validate & Deploy Kubernetes Manifests
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3

    - name: Validate Kubernetes Manifests
      run: |
        kubectl apply --dry-run=client -f k8s/