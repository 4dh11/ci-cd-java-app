
name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean verify

  docker-build-push:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-java-app:${{ github.sha }}

  deploy-to-cloud:
    name: Deploy to AWS Kubernetes
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy Kubernetes Files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@$EC2_HOST \
            "mkdir -p /home/ubuntu/k8s"

          scp -i ~/.ssh/id_rsa k8s/*.yaml \
            ubuntu@$EC2_HOST:/home/ubuntu/k8s/

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@$EC2_HOST "
            kubectl apply -f /home/ubuntu/k8s/ &&
            kubectl set image deployment/java-app-deployment \
            java-app-container=$DOCKERHUB_USERNAME/ci-cd-java-app:$IMAGE_TAG &&
            kubectl rollout status deployment/java-app-deployment \
            --timeout=180s &&
            kubectl get pods -o wide
          "
